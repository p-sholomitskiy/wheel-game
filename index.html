<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Montserrat:ital,wght@0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/wheel-game/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Game</title>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(102, 54, 161, 0.42), transparent 38%),
          #0c0e18;
        opacity: 1;
        visibility: visible;
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #app-loader.app-loader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-loader__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      .app-loader__logo {
        width: min(42vw, 180px);
        height: auto;
        filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.45));
      }

      .app-loader__spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: #ffdc3a;
        border-radius: 50%;
        animation: app-loader-spin 800ms linear infinite;
      }

      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader { transition: none; }
        .app-loader__spinner { animation-duration: 1.6s; }
      }
    </style>
    <script type="module" crossorigin src="/wheel-game/assets/index-CYcEk5pl.js"></script>
    <link rel="stylesheet" crossorigin href="/wheel-game/assets/index-iouEIsOf.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loader" role="status" aria-label="Загрузка">
      <div class="app-loader__content">
        <img
          class="app-loader__logo"
          src="/wheel-game/ui/webp/logo-slot.webp"
          width="180"
          alt=""
        />
        <span class="app-loader__spinner" aria-hidden="true"></span>
      </div>
    </div>
  </body>
</html>
